# The fleet server, ready to run.
#
#   export SUPPORTONE_FLEET_TOKEN="$(openssl rand -base64 32)"
#   docker compose up --build
#
# Then open http://localhost:8080 and sign in with any username and that token
# as the password.
#
# The server refuses to start without SUPPORTONE_FLEET_TOKEN, deliberately:
# there is no default, because a default would become the token every
# deployment that skipped this step is using.
#
# TLS is not terminated here. Put this behind a reverse proxy that does before
# exposing it beyond a trusted network — see docs/FLEET.md. Until then, bind it
# to loopback by setting SUPPORTONE_FLEET_BIND=127.0.0.1:8080.

services:
  server:
    build:
      context: .
      args:
        VERSION: ${SUPPORTONE_VERSION:-dev}
    image: supportone-server:${SUPPORTONE_VERSION:-dev}
    restart: unless-stopped

    environment:
      # No default. Compose fails to start rather than serving a fleet with a
      # token anyone could look up in this file.
      SUPPORTONE_FLEET_TOKEN: ${SUPPORTONE_FLEET_TOKEN:?set SUPPORTONE_FLEET_TOKEN to a secret of at least 24 characters}

    ports:
      - "${SUPPORTONE_FLEET_BIND:-127.0.0.1:8080}:8080"

    volumes:
      - fleet-data:/var/lib/supportone

    # The server writes to its data volume and reads nothing else.
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # The image has no shell and no curl, so the binary answers for itself.
      test: ["CMD", "/supportone-server", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  fleet-data:
