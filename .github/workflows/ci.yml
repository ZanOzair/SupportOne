name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Tool versions are pinned so a CI run is reproducible, and actions are
  # pinned to commit digests rather than tags: a tag can be moved under you,
  # and an action runs with the same access as the job that calls it. The
  # trailing comment on each is the version that digest was, so a person can
  # read the file without looking anything up.
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.7.0
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  TOOLCHAIN_GO_VERSION: "1.26.x"
  NODE_VERSION: "22.x"
  MIN_COVERAGE: "80.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Enforce coverage floor on internal/
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -coverprofile=internal.out ./internal/... > /dev/null
          total=$(go tool cover -func=internal.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "internal/ coverage: ${total}%  (floor ${MIN_COVERAGE}%)"
          awk -v got="$total" -v min="$MIN_COVERAGE" 'BEGIN { exit (got + 0 >= min + 0) ? 0 : 1 }'

  build:
    name: Build every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags, and the build's timestamp comes from
          # the commit rather than the clock.
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      # The same script a release runs and a person can run, rather than CI's
      # own copy of the build flags. One definition means the artifacts anyone
      # rebuilds are the artifacts that were published, and there is no second
      # place for -trimpath or CGO_ENABLED to drift out of agreement.
      - name: Build
        run: scripts/release.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supportone-artifacts
          path: dist/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.TOOLCHAIN_GO_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint runs gosec, so static security analysis fails the build here.
      - name: golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run --timeout 5m

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.TOOLCHAIN_GO_VERSION }}

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/agent-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/agent-ui/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # npm's audit endpoint is unreliable: it has returned 400 and 503 and
      # succeeded, all on the same lockfile within one hour, and npm has
      # announced this endpoint is being retired. A transient failure there
      # must not be able to look like a clean audit, and must not turn the
      # build red on its own either.
      #
      # So: a real advisory fails immediately, because retrying will not
      # change it. Only a registry failure is retried, and exhausting the
      # retries still fails the build. Nothing here can pass an audit that
      # did not actually run.
      #
      # When the endpoint is finally retired, replace this with a scanner
      # that reads the lockfile against its own database — osv-scanner does,
      # and exits non-zero both on findings and on an unreachable database.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if output=$(npm audit --audit-level=high 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output"

            if ! printf '%s' "$output" | grep -q 'audit endpoint returned an error'; then
              echo "A dependency has a high-severity advisory. Fix or update it."
              exit 1
            fi

            echo "The npm audit endpoint failed (attempt ${attempt} of 3)."
            sleep $((attempt * 20))
          done

          echo "The npm audit endpoint did not answer after 3 attempts, so the"
          echo "dependencies were never actually audited. Failing rather than"
          echo "reporting an audit that did not run."
          exit 1

      - name: Build
        run: npm run build

      # The built interface is committed so `go build` works without Node. If a
      # rebuild changes it, the commit is stale.
      - name: Committed build is current
        working-directory: .
        run: |
          if ! git diff --quiet -- web/agent-ui/dist; then
            echo "web/agent-ui/dist differs from a fresh build."
            echo "Run 'npm run build' in web/agent-ui and commit the result."
            git diff --stat -- web/agent-ui/dist
            exit 1
          fi

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.TOOLCHAIN_GO_VERSION }}

      - name: Generate CycloneDX SBOM
        run: |
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          cyclonedx-gomod mod -json -output sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
