name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Tool versions are pinned so a CI run is reproducible. Actions are pinned to
  # major tags today and will move to commit digests when release signing lands.
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.7.0
  CYCLONEDX_GOMOD_VERSION: v1.12.0
  TOOLCHAIN_GO_VERSION: "1.26.x"
  NODE_VERSION: "22.x"
  MIN_COVERAGE: "80.0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...

      - name: Enforce coverage floor on internal/
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -coverprofile=internal.out ./internal/... > /dev/null
          total=$(go tool cover -func=internal.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "internal/ coverage: ${total}%  (floor ${MIN_COVERAGE}%)"
          awk -v got="$total" -v min="$MIN_COVERAGE" 'BEGIN { exit (got + 0 >= min + 0) ? 0 : 1 }'

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          mkdir -p dist
          for cmd in supportone-agent supportone-server; do
            go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.buildDate=${SOURCE_DATE_EPOCH:-unknown}" \
              -o "dist/${cmd}-${GOOS}-${GOARCH}${suffix}" "./cmd/${cmd}"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: supportone-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.TOOLCHAIN_GO_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint runs gosec, so static security analysis fails the build here.
      - name: golangci-lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run --timeout 5m

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.TOOLCHAIN_GO_VERSION }}

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/agent-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/agent-ui/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # The built interface is committed so `go build` works without Node. If a
      # rebuild changes it, the commit is stale.
      - name: Committed build is current
        working-directory: .
        run: |
          if ! git diff --quiet -- web/agent-ui/dist; then
            echo "web/agent-ui/dist differs from a fresh build."
            echo "Run 'npm run build' in web/agent-ui and commit the result."
            git diff --stat -- web/agent-ui/dist
            exit 1
          fi

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.TOOLCHAIN_GO_VERSION }}

      - name: Generate CycloneDX SBOM
        run: |
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          cyclonedx-gomod mod -json -output sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
